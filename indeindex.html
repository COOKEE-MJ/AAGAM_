<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aagam - Natural Disaster Command Portal</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="bg-slate-100 overflow-hidden h-screen flex">

  <!-- LEFT SIDEBAR -->
  <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col justify-between hidden md:flex">
    <div>
      <!-- AAGAM BRANDING -->
      <div class="flex items-center gap-3 px-6 py-6 border-b border-slate-800">
        <div class="bg-rose-600 p-2 rounded-lg text-white shadow-lg shadow-rose-600/40">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
        </div>
        <div>
          <span class="font-black text-lg text-white tracking-wider block leading-tight">AAGAM</span>
          <span class="text-[10px] text-rose-400 font-semibold uppercase tracking-widest">Disaster Response</span>
        </div>
      </div>

      <!-- Interactive Sidebar Navigation -->
      <nav class="px-4 py-6 space-y-1" id="sidebar-nav">
        <a href="#" onclick="switchTab('overview', this)" class="flex items-center gap-3 px-4 py-3 bg-rose-600 text-white rounded-xl font-medium shadow-lg shadow-rose-600/35 transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg> Overview
        </a>
        <a href="#" onclick="switchTab('heatmap', this)" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg> Disaster Heatmap
        </a>
        <a href="#" onclick="switchTab('reports', this)" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg> Incident Reports
        </a>
        <a href="#" onclick="switchTab('cases', this)" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg> Rescue Cases
        </a>
        <a href="#" onclick="switchTab('analytics', this)" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg> Impact Analytics
        </a>
      </nav>
    </div>

    <div class="p-4 border-t border-slate-800">
      <a href="#" onclick="switchTab('settings', this)" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-800 hover:text-white rounded-xl transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg> Settings
      </a>
    </div>
  </aside>

  <!-- MAIN CONTAINER -->
  <main class="flex-1 flex flex-col overflow-y-auto">
    
    <!-- TOP HEADER -->
    <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-50">
      <div>
        <h1 class="text-xl font-bold text-slate-900">Aagam Disaster Command Center</h1>
        <p class="text-xs text-slate-500">Emergency & Natural Disaster Response Operations for <span id="region-subtitle" class="font-semibold text-slate-700">National Capital Territory of Delhi</span></p>
      </div>

      <div class="flex items-center gap-4">
        <!-- Region Dropdown (Delhi Default, Punjab, Haryana, Uttarakhand) -->
        <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl text-sm font-medium">
          <span>Region:</span>
          <select id="regionSelect" onchange="handleRegionChange(this.value)" class="bg-transparent font-semibold text-rose-600 focus:outline-none cursor-pointer">
            <option value="delhi">Delhi (Default)</option>
            <option value="punjab">Punjab</option>
            <option value="haryana">Haryana</option>
            <option value="uttarakhand">Uttarakhand</option>
          </select>
        </div>

        <div class="bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl text-xs font-semibold text-rose-600 flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-rose-600 animate-pulse"></span> Live Telemetry
        </div>

        <div class="w-9 h-9 rounded-full bg-rose-600 text-white flex items-center justify-center font-bold text-sm shadow">
          A
        </div>
      </div>
    </header>

    <!-- DYNAMIC CONTENT VIEW AREA -->
    <div class="p-8 space-y-6 flex-1" id="main-content-area">
      <!-- Populated dynamically -->
    </div>
  </main>

  <!-- DATA & STATE REPOSITORY SCRIPT -->
  <script>
    const dataRepo = {
      delhi: {
        name: "National Capital Territory of Delhi",
        center: [28.6139, 77.2090],
        zoom: 11,
        stats: { total: "142", resolved: "98", progress: "31", pending: "13" },
        issues: [
          { name: 'Earthquake Tremors / Structural Stress', count: 54, percent: '38%' },
          { name: 'Urban Flash Flooding (Yamuna Overflow)', count: 42, percent: '30%' },
          { name: 'Severe Cyclonic Windstorm', count: 26, percent: '18%' },
          { name: 'Industrial Gas Leak / Hazard', count: 20, percent: '14%' }
        ],
        points: [
          { lat: 28.6139, lng: 77.2090, intensity: 'High', zone: 'Central Delhi (Tremors)', reportsCount: 45 },
          { lat: 28.7041, lng: 77.1025, intensity: 'High', zone: 'Yamuna Bank Flood Zone', reportsCount: 52 },
          { lat: 28.5355, lng: 77.2610, intensity: 'Medium', zone: 'South Delhi District', reportsCount: 20 },
          { lat: 28.6280, lng: 77.3649, intensity: 'High', zone: 'East Delhi Waterlogging', reportsCount: 25 }
        ],
        activity: [
          { text: 'Earthquake magnitude 4.2 tremor reported in Central Delhi', time: '8m ago', type: 'rose' },
          { text: 'Yamuna flood evacuation completed in North Zone', time: '22m ago', type: 'emerald' },
          { text: 'Emergency rescue shelter opened in East Delhi', time: '45m ago', type: 'rose' }
        ],
        reports: [
          { id: "REP-DL-EQ1", disaster: "Earthquake Aftershock", location: "Central & Connaught Place", reportedBy: "312 Citizens", solutionRate: "85%", status: "Contained" },
          { id: "REP-DL-FL2", disaster: "Yamuna River Flash Flood", location: "Mayur Vihar & Kashmere Gate", reportedBy: "540 Citizens", solutionRate: "62%", status: "Active Rescue" },
          { id: "REP-DL-ST3", disaster: "Severe Cyclonic Windstorm", location: "South Delhi District", reportedBy: "180 Citizens", solutionRate: "90%", status: "Resolved" }
        ],
        cases: [
          { id: "CAS-901", disaster: "Structural Collapse (Tremor)", location: "Paharganj, Central Delhi", affected: "45 People", percentSolved: "70%", status: "In Progress", severity: "Critical" },
          { id: "CAS-902", disaster: "Flash Flood Submergence", location: "Yamuna Bazaar", affected: "1,200 People", percentSolved: "40%", status: "Active Rescue", severity: "Emergency" },
          { id: "CAS-903", disaster: "Uprooted Trees / Power Grid Failure", location: "Vasant Vihar", affected: "120 Homes", percentSolved: "100%", status: "Resolved", severity: "Moderate" }
        ],
        analytics: { avgResponseTime: "12.4 Minutes", totalEvacuated: "4,850", rescueTeamsActive: "34 Units", containmentRate: "78.5%" }
      },
      punjab: {
        name: "Punjab",
        center: [31.1471, 75.3412],
        zoom: 9,
        stats: { total: "89", resolved: "64", progress: "18", pending: "7" },
        issues: [
          { name: 'River Flooding (Sutlej/Beas Basin)', count: 45, percent: '50%' },
          { name: 'Severe Hailstorm & Crop Damage', count: 24, percent: '27%' },
          { name: 'Earthquake Tremors', count: 20, percent: '23%' }
        ],
        points: [
          { lat: 31.6340, lng: 74.8723, intensity: 'High', zone: 'Amritsar Flood Basin', reportsCount: 38 },
          { lat: 30.9010, lng: 75.8573, intensity: 'Medium', zone: 'Ludhiana District', reportsCount: 30 },
          { lat: 30.7333, lng: 76.7794, intensity: 'Low', zone: 'Mohali Border', reportsCount: 21 }
        ],
        activity: [
          { text: 'Sutlej river water level warning issued for Amritsar', time: '14m ago', type: 'rose' },
          { text: 'Flood rescue boat deployed in Ludhiana sector', time: '35m ago', type: 'emerald' }
        ],
        reports: [
          { id: "REP-PB-FL1", disaster: "Sutlej Basin Overflow", location: "Firozpur & Amritsar rural", reportedBy: "890 Citizens", solutionRate: "65%", status: "Active Rescue" },
          { id: "REP-PB-HS2", disaster: "Severe Hailstorm", location: "Jalandhar Farms", reportedBy: "210 Citizens", solutionRate: "100%", status: "Resolved" }
        ],
        cases: [
          { id: "CAS-401", disaster: "River Embankment Breach", location: "Amritsar Outskirts", affected: "2,300 People", percentSolved: "55%", status: "Active Rescue", severity: "Emergency" }
        ],
        analytics: { avgResponseTime: "15.1 Minutes", totalEvacuated: "6,200", rescueTeamsActive: "22 Units", containmentRate: "81.0%" }
      },
      haryana: {
        name: "Haryana",
        center: [29.0588, 76.0856],
        zoom: 9,
        stats: { total: "64", resolved: "48", progress: "12", pending: "4" },
        issues: [
          { name: 'Agricultural Drought / Heatwave', count: 30, percent: '47%' },
          { name: 'Flash Flooding (Yamuna/Ghaggar)', count: 20, percent: '31%' },
          { name: 'Earthquake Tremors', count: 14, percent: '22%' }
        ],
        points: [
          { lat: 28.4595, lng: 77.0266, intensity: 'Medium', zone: 'Gurugram Waterlogging', reportsCount: 28 },
          { lat: 29.9659, lng: 76.8383, intensity: 'High', zone: 'Ambala Flood Zone', reportsCount: 36 }
        ],
        activity: [
          { text: 'Drainage overflow emergency managed in Gurugram', time: '20m ago', type: 'emerald' },
          { text: 'Ghaggar river level monitored near Ambala', time: '50m ago', type: 'rose' }
        ],
        reports: [
          { id: "REP-HR-FL1", disaster: "Urban Flash Flood", location: "Gurugram Cyber City Underpasses", reportedBy: "410 Citizens", solutionRate: "92%", status: "Contained" }
        ],
        cases: [
          { id: "CAS-601", disaster: "Flash Flood Submergence", location: "Ambala Highway", affected: "450 People", percentSolved: "85%", status: "In Progress", severity: "High" }
        ],
        analytics: { avgResponseTime: "10.8 Minutes", totalEvacuated: "1,540", rescueTeamsActive: "18 Units", containmentRate: "86.5%" }
      },
      uttarakhand: {
        name: "Uttarakhand",
        center: [30.0668, 79.0193],
        zoom: 8,
        stats: { total: "198", resolved: "120", progress: "52", pending: "26" },
        issues: [
          { name: 'Major Landslide / Rockfall', count: 88, percent: '44%' },
          { name: 'Cloudburst & Flash Flood (Himalayan)', count: 70, percent: '35%' },
          { name: 'Severe Earthquake Faultline Activity', count: 40, percent: '21%' }
        ],
        points: [
          { lat: 30.3165, lng: 78.0322, intensity: 'High', zone: 'Dehradun Valley Landslide', reportsCount: 65 },
          { lat: 29.3803, lng: 79.4636, intensity: 'High', zone: 'Nainital Lake Overflow', reportsCount: 54 },
          { lat: 30.5550, lng: 79.3200, intensity: 'High', zone: 'Chamoli Cloudburst Zone', reportsCount: 79 }
        ],
        activity: [
          { text: 'Major landslide blocking Badrinath highway cleared partially', time: '5m ago', type: 'emerald' },
          { text: 'Cloudburst alert triggered in Chamoli district', time: '19m ago', type: 'rose' }
        ],
        reports: [
          { id: "REP-UK-LS1", disaster: "Mountain Landslide & Road Blockade", location: "Rishikesh-Badrinath Highway", reportedBy: "1,450 Citizens", solutionRate: "50%", status: "Active Rescue" },
          { id: "REP-UK-CB2", disaster: "Cloudburst Flash Flood", location: "Chamoli & Uttarkashi", reportedBy: "890 Citizens", solutionRate: "40%", status: "Emergency Response" }
        ],
        cases: [
          { id: "CAS-101", disaster: "Cloudburst & Debris Flow", location: "Chamoli District", affected: "3,400 People", percentSolved: "45%", status: "Active Rescue", severity: "Critical" },
          { id: "CAS-102", disaster: "Landslide Trapped Vehicles", location: "Mussoorie-Dehradun Route", affected: "90 People", percentSolved: "80%", status: "In Progress", severity: "High" }
        ],
        analytics: { avgResponseTime: "24.2 Minutes", totalEvacuated: "9,100", rescueTeamsActive: "58 Units", containmentRate: "64.0%" }
      }
    };

    let currentTab = 'overview';
    let map = null;
    let currentMarkers = [];

    function renderCurrentTab() {
      const regionKey = document.getElementById('regionSelect').value;
      const d = dataRepo[regionKey];
      const contentArea = document.getElementById('main-content-area');

      if (currentTab === 'overview') {
        contentArea.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
              <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Total Disaster Reports</span>
              <h2 id="stat-total" class="text-3xl font-extrabold text-slate-900 my-3">${d.stats.total}</h2>
              <span class="text-xs font-semibold text-rose-600">Active Emergency Mode</span>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
              <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Resolved / Safe</span>
              <h2 id="stat-resolved" class="text-3xl font-extrabold text-slate-900 my-3">${d.stats.resolved}</h2>
              <span class="text-xs font-semibold text-emerald-600">Evacuated & Secured</span>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
              <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Rescue in Progress</span>
              <h2 id="stat-progress" class="text-3xl font-extrabold text-slate-900 my-3">${d.stats.progress}</h2>
              <span class="text-xs font-semibold text-amber-600">Teams Deployed</span>
            </div>
            <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
              <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Critical Pending</span>
              <h2 id="stat-pending" class="text-3xl font-extrabold text-slate-900 my-3">${d.stats.pending}</h2>
              <span class="text-xs font-semibold text-rose-500">High Priority Attention</span>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col">
              <div class="flex justify-between items-center mb-4">
                <h3 id="map-title" class="font-bold text-slate-900 text-lg">Natural Disaster Heatmap — ${d.name}</h3>
                <div class="flex items-center gap-2 text-xs font-medium text-slate-500">
                  <span>Low Risk</span><div class="w-20 h-2.5 rounded-full bg-gradient-to-r from-emerald-400 via-amber-400 to-rose-600"></div><span>High Risk</span>
                </div>
              </div>
              <div class="flex-1 w-full h-[380px] rounded-xl overflow-hidden border border-slate-100 z-0" id="map"></div>
            </div>
            <div class="space-y-6 flex flex-col">
              <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex-1">
                <h3 class="font-bold text-slate-900 text-base mb-4">Disaster Types Reported</h3>
                <div id="issues-list" class="space-y-4">
                  ${d.issues.map(i => `<div class="flex items-center justify-between"><span class="text-sm font-medium text-slate-700">${i.name}</span><div class="flex items-center gap-3"><span class="text-sm font-bold text-slate-900">${i.count}</span><span class="text-xs font-semibold text-slate-400 w-8 text-right">${i.percent}</span></div></div>`).join('')}
                </div>
              </div>
              <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                <h3 class="font-bold text-slate-900 text-base mb-4">Live Incident Feed</h3>
                <div id="activity-list" class="space-y-3">
                  ${d.activity.map(a => `<div class="flex items-center justify-between text-xs py-2 border-b border-slate-100 last:border-none"><div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-${a.type}-500"></span><span class="text-slate-700 font-medium">${a.text}</span></div><span class="text-slate-400">${a.time}</span></div>`).join('')}
                </div>
              </div>
            </div>
          </div>
        `;

        setTimeout(() => {
          if (map) { map.remove(); map = null; }
          map = L.map('map').setView(d.center, d.zoom);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
          renderMarkers(d.points);
        }, 50);

      } else if (currentTab === 'heatmap') {
        contentArea.innerHTML = `
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col h-[750px]">
            <h3 class="font-bold text-slate-900 text-xl mb-4">Dedicated Region Severity Map — ${d.name}</h3>
            <div class="flex-1 w-full rounded-xl overflow-hidden border border-slate-100 z-0" id="fullscreen-map"></div>
          </div>`;
        setTimeout(() => {
          const fsMap = L.map('fullscreen-map').setView(d.center, d.zoom);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(fsMap);
          d.points.forEach(pt => {
            let color = pt.intensity === 'High' ? '#e11d48' : pt.intensity === 'Medium' ? '#f59e0b' : '#10b981';
            L.circleMarker([pt.lat, pt.lng], { color, fillColor: color, fillOpacity: 0.6, radius: 45, weight: 1 }).addTo(fsMap)
             .bindPopup(`<b>${pt.zone}</b><br>Risk Level: ${pt.intensity}<br>Reports: ${pt.reportsCount}`);
          });
        }, 50);

      } else if (currentTab === 'reports') {
        contentArea.innerHTML = `
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
            <div class="flex justify-between items-center">
              <div>
                <h3 class="font-bold text-slate-900 text-xl">Aagam Incident Reports — ${d.name}</h3>
                <p class="text-xs text-slate-500 mt-1">Crowdsourced natural disaster alerts and verified rescue logs.</p>
              </div>
              <button class="bg-rose-600 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow hover:bg-rose-700 transition">+ Broadcast Alert</button>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm text-slate-600">
                <thead class="bg-slate-50 text-xs uppercase text-slate-500 border-b border-slate-200">
                  <tr>
                    <th class="px-4 py-3">Report ID</th>
                    <th class="px-4 py-3">Disaster Event</th>
                    <th class="px-4 py-3">Location Affected</th>
                    <th class="px-4 py-3">Citizen Reports</th>
                    <th class="px-4 py-3">Solution / Containment</th>
                    <th class="px-4 py-3 text-right">Status</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${d.reports.map(r => `
                    <tr class="hover:bg-slate-50">
                      <td class="px-4 py-3 font-semibold text-slate-900">${r.id}</td>
                      <td class="px-4 py-3 font-medium text-slate-800">${r.disaster}</td>
                      <td class="px-4 py-3 text-xs text-slate-500">${r.location}</td>
                      <td class="px-4 py-3 text-xs text-slate-500">${r.reportedBy}</td>
                      <td class="px-4 py-3"><span class="font-semibold text-rose-600">${r.solutionRate}</span></td>
                      <td class="px-4 py-3 text-right"><span class="px-2.5 py-1 text-xs font-semibold rounded-full bg-rose-50 text-rose-600">${r.status}</span></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>`;

      } else if (currentTab === 'cases') {
        contentArea.innerHTML = `
          <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
            <div class="flex justify-between items-center">
              <div>
                <h3 class="font-bold text-slate-900 text-xl">Aagam Active Rescue Operations — ${d.name}</h3>
                <p class="text-xs text-slate-500 mt-1">Live tracking of ongoing disaster relief cases and affected populations.</p>
              </div>
              <button class="bg-rose-600 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow hover:bg-rose-700 transition">+ Dispatch Rescue Unit</button>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm text-slate-600">
                <thead class="bg-slate-50 text-xs uppercase text-slate-500 border-b border-slate-200">
                  <tr>
                    <th class="px-4 py-3">Case ID</th>
                    <th class="px-4 py-3">Emergency Type</th>
                    <th class="px-4 py-3">Location</th>
                    <th class="px-4 py-3">Population Affected</th>
                    <th class="px-4 py-3">Solution Progress</th>
                    <th class="px-4 py-3 text-right">Severity</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${d.cases.map(c => `
                    <tr class="hover:bg-slate-50">
                      <td class="px-4 py-3 font-semibold text-slate-900">${c.id}</td>
                      <td class="px-4 py-3 font-medium text-slate-800">${c.disaster}</td>
                      <td class="px-4 py-3 text-xs text-slate-500">${c.location}</td>
                      <td class="px-4 py-3 text-xs font-bold text-slate-700">${c.affected}</td>
                      <td class="px-4 py-3"><span class="font-semibold text-emerald-600">${c.percentSolved}</span></td>
                      <td class="px-4 py-3 text-right"><span class="px-2 py-0.5 text-xs font-bold rounded ${c.severity === 'Critical' ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'}">${c.severity}</span></td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>`;

      } else if (currentTab === 'analytics') {
        contentArea.innerHTML = `
          <div class="space-y-6">
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
              <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Avg Response Time</span>
                <h2 class="text-2xl font-extrabold text-slate-900 mt-2">${d.analytics.avgResponseTime}</h2>
              </div>
              <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Total Evacuated</span>
                <h2 class="text-2xl font-extrabold text-emerald-600 mt-2">${d.analytics.totalEvacuated} People</h2>
              </div>
              <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Active Rescue Units</span>
                <h2 class="text-2xl font-extrabold text-rose-600 mt-2">${d.analytics.rescueTeamsActive}</h2>
              </div>
              <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-500">Containment Rate</span>
                <h2 class="text-xl font-bold text-slate-900 mt-2">${d.analytics.containmentRate}</h2>
              </div>
            </div>
            <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm text-center py-16">
              <h3 class="text-lg font-bold text-slate-800">Aagam Impact & Mitigation Analytics — ${d.name}</h3>
              <p class="text-slate-500 text-sm mt-1">Real-time telemetry and state disaster management database integration active.</p>
            </div>
          </div>`;
      }
    }

    function renderMarkers(points) {
      if (!map) return;
      currentMarkers.forEach(m => map.removeLayer(m));
      currentMarkers = [];

      points.forEach(pt => {
        let color = pt.intensity === 'High' ? '#e11d48' : pt.intensity === 'Medium' ? '#f59e0b' : '#10b981';
        let radius = pt.intensity === 'High' ? 38 : pt.intensity === 'Medium' ? 28 : 18;
        let marker = L.circleMarker([pt.lat, pt.lng], { color, fillColor: color, fillOpacity: 0.5, radius, weight: 1 }).addTo(map);
        marker.bindPopup(`<b>${pt.zone}</b><br>Risk Level: ${pt.intensity}<br>Reports: ${pt.reportsCount}`);
        currentMarkers.push(marker);
      });
    }

    function handleRegionChange(key) {
      const d = dataRepo[key];
      document.getElementById('region-subtitle').innerText = d.name;
      renderCurrentTab();
    }

    function switchTab(tabName, element) {
      currentTab = tabName;
      document.querySelectorAll('#sidebar-nav a').forEach(a => {
        a.classList.remove('bg-rose-600', 'text-white', 'shadow-lg', 'shadow-rose-600/35');
        a.classList.add('hover:bg-slate-800', 'hover:text-white');
      });
      element.classList.add('bg-rose-600', 'text-white', 'shadow-lg', 'shadow-rose-600/35');
      element.classList.remove('hover:bg-slate-800', 'hover:text-white');

      renderCurrentTab();
    }

    // Initial load on startup
    renderCurrentTab();
  </script>
</body>
</html>
